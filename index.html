<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mi presupuesto</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#1F6F5C">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Mi presupuesto">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
:root{
  --bg:#EEF2EF; --surface:#FFFFFF; --surface2:#F6F8F7; --ink:#18262F; --muted:#5B6B73; --line:#D6DDD9;
  --accent:#1F6F5C; --accent-ink:#FFFFFF; --warn:#B76E06; --warn-bg:#FFF1D6; --danger:#B83A32; --danger-bg:#FBE3E0;
  --ok:#2E7D57; --ok-bg:#DDF1E5; --ice:#DCEFF7; --ice2:#BFE3F2; --ice-ink:#21739A; --shadow:0 1px 2px rgba(24,38,47,.08);
  --c1:#E08A3C; --c2:#B83A32; --c3:#7B5EA7; --c4:#8A9AA3; --c5:#1F6F5C; --c6:#21739A;
  color-scheme:light;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
  --bg:#10181C; --surface:#182329; --surface2:#1E2B32; --ink:#E7EEF0; --muted:#9AABB2; --line:#2A3A41;
  --accent:#4FB79A; --accent-ink:#0E1A16; --warn:#E3A43F; --warn-bg:#3A2C12; --danger:#E87A70; --danger-bg:#3D1F1C;
  --ok:#62C08F; --ok-bg:#183327; --ice:#16323E; --ice2:#1D4252; --ice-ink:#8CD0EA; --shadow:none; color-scheme:dark;
  --c1:#F0A55E; --c2:#E87A70; --c3:#B095DA; --c4:#6F818A; --c5:#4FB79A; --c6:#8CD0EA;}}
:root[data-theme="dark"]{
  --bg:#10181C; --surface:#182329; --surface2:#1E2B32; --ink:#E7EEF0; --muted:#9AABB2; --line:#2A3A41;
  --accent:#4FB79A; --accent-ink:#0E1A16; --warn:#E3A43F; --warn-bg:#3A2C12; --danger:#E87A70; --danger-bg:#3D1F1C;
  --ok:#62C08F; --ok-bg:#183327; --ice:#16323E; --ice2:#1D4252; --ice-ink:#8CD0EA; --shadow:none; color-scheme:dark;
  --c1:#F0A55E; --c2:#E87A70; --c3:#B095DA; --c4:#6F818A; --c5:#4FB79A; --c6:#8CD0EA;}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font-family:"Figtree",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:16px;line-height:1.45;min-height:100%;padding-bottom:96px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.num,.display{font-family:"Bricolage Grotesque","Figtree",system-ui,sans-serif;font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit}
.wrap{max-width:560px;margin:0 auto;padding:0 16px}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding:10px 0 8px}
.monthnav{display:flex;align-items:center;justify-content:space-between;gap:8px}
.monthnav h1{font-family:"Bricolage Grotesque",system-ui,sans-serif;font-size:1.15rem;font-weight:700;margin:0}
.iconbtn{border:1px solid var(--line);background:var(--surface);border-radius:999px;width:40px;height:40px;display:grid;place-items:center;cursor:pointer;font-size:1.1rem}
.iconbtn:focus-visible,.btn:focus-visible,.chip:focus-visible,.tab:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.hero{padding:18px 2px 6px}
.hero .lead{color:var(--muted);font-size:.95rem;margin:0}
.hero .big{font-size:clamp(2.4rem,11vw,3.4rem);font-weight:800;line-height:1.02;letter-spacing:-.02em;margin:4px 0 0}
.hero .big.neg{color:var(--danger)}
.trio{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin:14px 0 6px}
.sub{margin:6px 0 0;font-size:.93rem;color:var(--muted)}
.sub b{color:var(--ink)}
.trio div{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 10px 8px}
.trio small{display:block;color:var(--muted);font-size:.78rem}
.trio b{font-family:"Bricolage Grotesque",sans-serif;font-size:1.02rem;font-weight:700}
section.block{margin-top:22px}
section.block h2{font-family:"Bricolage Grotesque",sans-serif;font-size:1.05rem;font-weight:700;margin:0 0 10px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;box-shadow:var(--shadow)}
.alert{border-radius:14px;padding:11px 13px;margin-top:10px;font-size:.93rem;display:flex;gap:10px;align-items:flex-start}
.alert.danger{background:var(--danger-bg);color:var(--danger)}
.alert.warn{background:var(--warn-bg);color:var(--warn)}
.alert.ice{background:var(--ice);color:var(--ice-ink)}
.alert p{margin:0;color:var(--ink)}
.alert strong{color:inherit}
.row{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.bar{height:10px;border-radius:99px;background:var(--surface2);border:1px solid var(--line);overflow:hidden;margin:7px 0 4px}
.bar i{display:block;height:100%;border-radius:99px;background:var(--ok)}
.bar i.warn{background:var(--warn)} .bar i.danger{background:var(--danger)}
.muted{color:var(--muted)} .small{font-size:.84rem}
.list{display:flex;flex-direction:column;gap:12px}
.cat-line{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
.cat-line:last-child{border-bottom:0}
.cat-line .em{width:30px;text-align:center;font-size:1.15rem}
.cat-line .grow{flex:1;min-width:0}
/* cupos */
.cupo{position:relative;overflow:hidden}
.cupo.frozen{background:linear-gradient(160deg,var(--ice) 0%,var(--surface) 70%);border-color:var(--ice2)}
.cupo.frozen::after{content:"";position:absolute;inset:0;pointer-events:none;opacity:.55;
  background-image:radial-gradient(circle at 12% 18%,var(--ice2) 0 2px,transparent 3px),radial-gradient(circle at 78% 30%,var(--ice2) 0 1.5px,transparent 2.5px),
  radial-gradient(circle at 40% 70%,var(--ice2) 0 2px,transparent 3px),radial-gradient(circle at 90% 85%,var(--ice2) 0 1.5px,transparent 2.5px);}
.cupo .name{font-family:"Bricolage Grotesque",sans-serif;font-weight:700;font-size:1.08rem}
.badge{display:inline-flex;align-items:center;gap:5px;font-size:.78rem;font-weight:600;border-radius:99px;padding:3px 9px}
.badge.ice{background:var(--ice2);color:var(--ice-ink)}
.badge.ok{background:var(--ok-bg);color:var(--ok)} .badge.warn{background:var(--warn-bg);color:var(--warn)} .badge.danger{background:var(--danger-bg);color:var(--danger)}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;position:relative;z-index:1}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 14px;font-weight:600;cursor:pointer;min-height:44px}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.ice{background:var(--ice2);color:var(--ice-ink);border-color:var(--ice2)}
.btn.danger{background:var(--danger);color:#fff;border-color:var(--danger)}
.btn.block{width:100%}
.btn.ghost{background:transparent}
/* nav */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav.tabs .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.tab{border:0;background:transparent;padding:9px 4px 10px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.74rem;color:var(--muted);cursor:pointer;min-height:56px}
.tab span{font-size:1.2rem;line-height:1}
.tab[aria-current="page"]{color:var(--accent);font-weight:700}
.paid{color:var(--ok);font-weight:700;font-size:.9rem;white-space:nowrap}
.fab{position:fixed;right:max(16px,calc(50% - 264px));bottom:calc(76px + env(safe-area-inset-bottom,0px));z-index:21;border:0;border-radius:999px;background:var(--accent);color:var(--accent-ink);
  font-weight:700;font-size:1rem;padding:15px 20px;box-shadow:0 6px 18px rgba(0,0,0,.18);cursor:pointer}
/* sheet */
.scrim{position:fixed;inset:0;background:rgba(10,18,22,.45);z-index:40;display:none}
.scrim.open{display:block}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;background:var(--surface);border-radius:20px 20px 0 0;max-height:92vh;overflow:auto;
  transform:translateY(105%);visibility:hidden;transition:transform .22s ease,visibility 0s linear .22s;padding:8px 0 calc(16px + env(safe-area-inset-bottom,0px))}
.sheet.open{transform:none;visibility:visible;transition:transform .22s ease,visibility 0s}
@media (prefers-reduced-motion:reduce){.sheet{transition:none}}
.sheet .grip{width:42px;height:5px;border-radius:9px;background:var(--line);margin:4px auto 10px}
.sheet h3{font-family:"Bricolage Grotesque",sans-serif;font-size:1.2rem;margin:0 0 12px}
label.f{display:block;font-size:.85rem;color:var(--muted);margin:14px 0 6px;font-weight:600}
input.t,select.t{width:100%;border:1px solid var(--line);background:var(--surface2);color:var(--ink);border-radius:12px;padding:12px;font:inherit;min-height:46px}
input.money{font-family:"Bricolage Grotesque",sans-serif;font-size:2rem;font-weight:700;padding:10px 12px}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{border:1px solid var(--line);background:var(--surface2);border-radius:99px;padding:8px 12px;font-size:.9rem;cursor:pointer;min-height:40px}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
.chip.frozen{border-style:dashed;border-color:var(--ice-ink);color:var(--ice-ink)}
.chip.frozen[aria-pressed="true"]{background:var(--ice-ink);color:var(--surface);}
.seg{display:grid;grid-template-columns:repeat(4,1fr);border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-bottom:6px}
.seg button{border:0;background:var(--surface2);padding:10px 4px;font-size:.88rem;cursor:pointer;font-weight:600;min-height:44px}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--surface)}
.warnlist{display:flex;flex-direction:column;gap:8px;margin:6px 0 16px}
.item{display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:0}
.item .grow{flex:1;min-width:0}
.item .grow div{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.amt{font-family:"Bricolage Grotesque",sans-serif;font-weight:700;white-space:nowrap}
.amt.in{color:var(--ok)}
.del{border:0;background:transparent;color:var(--muted);font-size:1.05rem;cursor:pointer;width:36px;height:36px;border-radius:99px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(140px + env(safe-area-inset-bottom,0px));z-index:60;background:var(--ink);color:var(--surface);
  padding:10px 16px;border-radius:12px;font-size:.92rem;max-width:90vw;display:none}
.empty{text-align:center;padding:26px 10px;color:var(--muted)}
.topes-row{display:grid;grid-template-columns:30px 1fr 130px;gap:8px;align-items:center;padding:6px 0}
.topes-row input{min-height:42px;padding:8px 10px}
.money{display:flex;height:34px;border-radius:10px;overflow:hidden;border:1px solid var(--line);margin:10px 0 10px}
.money i{display:block;height:100%;min-width:2px}
.legend{display:grid;grid-template-columns:1fr 1fr;gap:6px 12px;font-size:.84rem}
.legend span{display:flex;align-items:center;gap:6px}
.legend em{font-style:normal;width:11px;height:11px;border-radius:3px;flex:none}
.legend b{margin-left:auto;font-family:"Bricolage Grotesque",sans-serif}
.chartbox{position:relative;height:240px}
.metas{display:grid;gap:8px}
.meta{display:flex;justify-content:space-between;gap:8px;padding:8px 0;border-bottom:1px solid var(--line);font-size:.92rem}
.meta:last-child{border-bottom:0}
.planrow{display:grid;grid-template-columns:1fr 112px 70px;gap:8px;align-items:center;padding:5px 0}
.planrow input,.planrow select{min-height:42px;padding:8px}
details summary{cursor:pointer;color:var(--accent);font-weight:600;padding:8px 0}
.tbl{overflow-x:auto}.tbl table{border-collapse:collapse;font-size:.82rem;width:100%}.tbl td,.tbl th{padding:5px 6px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}.tbl td:first-child,.tbl th:first-child{text-align:left}
.tag{display:inline-block;font-size:.72rem;font-weight:600;border-radius:99px;padding:1px 7px;margin-left:4px;vertical-align:1px}
.tag.antojo{background:var(--warn-bg);color:var(--warn)} .tag.planeado{background:var(--ice);color:var(--ice-ink)} .tag.necesario{background:var(--ok-bg);color:var(--ok)}
.rep{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;-webkit-overflow-scrolling:touch}
.rep .chip{white-space:nowrap;flex:none}
.swatches{display:flex;gap:10px;flex-wrap:wrap}
.sw{width:46px;height:46px;border-radius:14px;border:3px solid transparent;cursor:pointer}
.sw[aria-pressed="true"]{border-color:var(--ink)}
.ver{text-align:center;font-size:.78rem;color:var(--muted);margin:22px 0 4px}
.loading{padding:60px 0;text-align:center;color:var(--muted)}
.note{font-size:.8rem;color:var(--muted);margin-top:18px}
</style>
</head>
<body>
<header class="top"><div class="wrap monthnav">
  <button class="iconbtn" id="prevM" aria-label="Mes anterior">‹</button>
  <h1 id="mTitle">Mi presupuesto</h1>
  <button class="iconbtn" id="nextM" aria-label="Mes siguiente">›</button>
</div></header>

<main class="wrap" id="main"><div class="loading">Cargando tu presupuesto…</div></main>

<button class="fab" id="fab" aria-label="Registrar movimiento">+ Registrar</button>
<nav class="tabs" aria-label="Secciones"><div class="in">
  <button class="tab" data-v="inicio" aria-current="page"><span>◉</span>Inicio</button>
  <button class="tab" data-v="cupos"><span>❄</span>Cupos</button>
  <button class="tab" data-v="topes"><span>◔</span>Plan</button>
  <button class="tab" data-v="graficas"><span>▥</span>Gráficas</button>
  <button class="tab" data-v="historial"><span>≡</span>Movimientos</button>
</div></nav>

<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true"><div class="grip"></div><div class="wrap" id="sheetBody"></div></div>
<div class="toast" id="toast" role="status"></div>

<script>
(function(){
"use strict";
const CATS=[
 {id:'comidas',n:'Comidas fuera',e:'🍔'},{id:'mercado',n:'Mercado',e:'🛒'},{id:'vivienda',n:'Vivienda y servicios',e:'🏠'},
 {id:'transporte',n:'Transporte',e:'🚌'},{id:'salud',n:'Salud',e:'💊'},{id:'mascotas',n:'Mascotas',e:'🐾'},
 {id:'personal',n:'Cuidado personal y ropa',e:'💅'},{id:'entretenimiento',n:'Salidas y entretenimiento',e:'🎬'},
 {id:'regalos',n:'Regalos',e:'🎁'},{id:'formacion',n:'Formación y trabajo',e:'📚'},{id:'suscripciones',n:'Suscripciones',e:'📱'},
 {id:'carlos',n:'Pagos por Carlos',e:'🤝'},{id:'otros',n:'Otros',e:'•'}];
const INGRESOS=['Sueldo','Prima','Transferencia de Carlos','Venta','Otro'];
const VERSION='2.0 web · 26 oct 2026';
const TIPOS=[{id:'necesario',n:'Necesario'},{id:'planeado',n:'Planeado'},{id:'antojo',n:'Antojo'}];
const TEMAS={verde:['#1F6F5C','#4FB79A'],azul:['#2763A8','#6FA8E8'],ciruela:['#7A3E7A','#C58BC5'],atardecer:['#C2502E','#F08A63']};
const MESES=['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
const catById=id=>CATS.find(c=>c.id===id)||CATS[CATS.length-1];
const fmt=n=>'$'+Math.round(n||0).toLocaleString('es-CO');
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const parseMoney=s=>{const n=parseInt(String(s).replace(/[^\d]/g,''),10);return isNaN(n)?0:n};
const today=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const keyOf=f=>'m-'+f.slice(0,7);
const uid8=()=>Math.random().toString(36).slice(2,10);

const S={mode:null,db:null,uid:null,cfg:null,month:null,mk:keyOf(today()),view:'inicio',downloads:null};
const emptyCfg=()=>({cupos:[],topes:{},fijos:[],metas:[]});
const normCfg=c=>{c=c||emptyCfg();c.cupos=c.cupos||[];c.topes=c.topes||{};c.fijos=c.fijos||[];
  if(!c.metas){c.metas=c.fondo?[{id:'fondo',nombre:c.fondo.nombre,meta:c.fondo.meta,saldo:c.fondo.saldo}]:[];}
  delete c.fondo;c.rec=c.rec||[];return c};
const metaById=id=>S.cfg.metas.find(m=>m.id===(id||'fondo'))||S.cfg.metas[0];
function applyTema(){const t=TEMAS[(S.cfg&&S.cfg.tema)||'verde']||TEMAS.verde;const dark=document.documentElement.dataset.theme==='dark'||(document.documentElement.dataset.theme!=='light'&&matchMedia('(prefers-color-scheme: dark)').matches);
  document.documentElement.style.setProperty('--accent',dark?t[1]:t[0]);document.documentElement.style.setProperty('--c5',dark?t[1]:t[0]);}
try{matchMedia('(prefers-color-scheme: dark)').addEventListener('change',()=>{applyTema();render();});}catch(e){}

/* ---------- almacenamiento ---------- */
const LS={get(k){try{const v=localStorage.getItem('mipres:'+k);return v?JSON.parse(v):null}catch(e){return null}},
          set(k,v){try{localStorage.setItem('mipres:'+k,JSON.stringify(v))}catch(e){}}};
const queues={};
function ref(key){return S.db.collection('data/users/'+S.uid).doc(key)}
function persist(key,data){
  const body=JSON.parse(JSON.stringify(data));
  if(S.mode==='db'){
    queues[key]=(queues[key]||Promise.resolve()).then(()=>ref(key).set(body)).catch(e=>{
      toast(e&&e.code==='quota_exceeded'?'Se llenó el espacio de la app. Borra meses viejos.':'No se pudo guardar. Revisa tu conexión e inténtalo de nuevo.');});
  } else LS.set(key,body);
}
async function readMonth(key){
  if(key===S.mk&&S.month) return JSON.parse(JSON.stringify(S.month));
  if(S.mode==='db'){try{const s=await ref(key).get();return s.exists?JSON.parse(JSON.stringify(s.data())):{items:[]}}catch(e){return {items:[]}}}
  return LS.get(key)||{items:[]};
}
let unsubM=null;
function watchMonth(){
  if(S.mode==='db'){
    if(unsubM) unsubM();
    S.month=null; render();
    const k=S.mk;
    unsubM=ref(k).onSnapshot(s=>{if(k!==S.mk)return;S.month=s.exists?JSON.parse(JSON.stringify(s.data())):{items:[]};if(!S.month.items)S.month.items=[];render();},
      ()=>{S.month=S.month||{items:[]};render();});
  } else { S.month=LS.get(S.mk)||{items:[]}; render(); }
}
async function init(){
  let db=null,user=null,dl=null;
  try{ if(window.claude&&typeof window.claude.use==='function'){
    [db,user,dl]=await Promise.all([window.claude.use('db'),window.claude.use('user'),window.claude.use('downloads')]); } }catch(e){}
  S.downloads=dl;
  let id=null; if(db&&user){try{id=await user.id()}catch(e){}}
  if(db&&id){
    S.mode='db';S.db=db;S.uid=id;
    ref('config').onSnapshot(s=>{S.cfg=normCfg(s.exists?JSON.parse(JSON.stringify(s.data())):null);render();},
      ()=>{S.cfg=S.cfg||emptyCfg();render();});
  } else { S.mode='local'; S.cfg=normCfg(LS.get('config')); }
  watchMonth();
}

/* ---------- cálculos ---------- */
function totals(m){
  const it=(m&&m.items)||[]; let ing=0,gas=0,cash=0,pag=0,ah=0,conMeta=0,tarjeta=0; const porCat={},fijosPag={},porTipo={},porCupo={},usoFuente={},extras=[];
  it.forEach(x=>{ if(x.fijoId)fijosPag[x.fijoId]=(fijosPag[x.fijoId]||0)+x.monto;
    if(x.fuente)usoFuente[x.fuente]=(usoFuente[x.fuente]||0)+x.monto;
    const deMeta=String(x.fuente||'').startsWith('meta:');
    if(x.t==='ingreso'){ing+=x.monto;if(x.concepto&&x.concepto!=='Sueldo')extras.push(x);}
    else if(x.t==='pago'){if(deMeta)conMeta+=x.monto;else pag+=x.monto;}
    else if(x.t==='ahorro')ah+=(x.dir==='retiro'?-1:1)*x.monto;
    else{gas+=x.monto;porCat[x.cat]=(porCat[x.cat]||0)+x.monto;if(x.tipo)porTipo[x.tipo]=(porTipo[x.tipo]||0)+x.monto;
      if(x.medio==='efectivo'){if(deMeta)conMeta+=x.monto;else cash+=x.monto;}else{tarjeta+=x.monto;porCupo[x.medio]=(porCupo[x.medio]||0)+x.monto;}} });
  return {ing,gas,cash,pag,ah,conMeta,tarjeta,disp:ing-cash-pag-ah,porCat,fijosPag,porTipo,porCupo,usoFuente,extras};
}
function cupoState(c){const p=c.cupo>0?c.consumo/c.cupo:0;return {p,cls:p>=.7?'danger':p>=.3?'warn':'ok',txt:c.consumo<=0?'Sin deuda':p>=.7?'Crítico':p>=.3?'Precaución':'Bien'}}
const metaOf=c=>(c.meta==null?0.3:c.meta);
const faltaMeta=c=>Math.max(0,c.consumo-metaOf(c)*c.cupo);

function bar(p,cls){return `<div class="bar"><i class="${cls}" style="width:${Math.min(100,Math.max(0,p*100)).toFixed(1)}%"></i></div>`}

    <div class="trio"><div><small>Ingresos</small><b>${fmt(T.ing)}</b></div><div><small>Gastado</small><b>${fmt(T.gas)}</b></div><div><small>Pagado a deudas</small><b>${fmt(T.pag)}</b></div><div><small>${T.ah<0?'Sacado del ahorro':'Ahorrado'}</small><b>${fmt(Math.abs(T.ah))}</b></div></div></div>`;
  if(recs.length&&S.mk===keyOf(today()))h+=`<section class="block" style="margin-top:12px"><h2>Repetir con un toque</h2><div class="rep">${recs.map((r,i)=>`<button class="chip" data-rep="${i}">${catById(r.cat).e} ${esc(r.nota||catById(r.cat).n)} · ${fmt(r.monto)}</button>`).join('')}</div></section>`;
  // visual de lo que va quedando
  {const segs=[['Gastos',T.cash,'--c1'],['Pagos a deudas',T.pag,'--c2'],['Ahorro',Math.max(0,T.ah),'--c3'],['Fijos por pagar',pend,'--c4']];
   const usado=segs.reduce((a,x)=>a+x[1],0), libre=T.ing-usado, tot=Math.max(T.ing,usado);

     segs.concat(libre>0?[['Libre',libre,'--c5']]:[]).filter(x=>x[1]>0).map(x=>`<i style="width:${(x[1]/tot*100).toFixed(2)}%;background:var(${x[2]})"></i>`).join('')+`</div><div class="legend">`+
     segs.concat([['Libre',Math.max(0,libre),'--c5']]).map(x=>`<span><em style="background:var(${x[2]})"></em>${x[0]}<b>${fmt(x[1])}</b></span>`).join('')+`</div>`+
     (libre<0?`<div class="alert danger"><p>Lo que ya salió más lo que falta por pagar supera tus ingresos del mes en <strong>${fmt(-libre)}</strong>.</p></div>`:'')+`</div></section>`;}}
  // pagos fijos

        ${pg>=f.monto?`<span class="paid">✓ Pagado</span>`:`<button class="btn" data-fpay="${esc(f.id)}">${pg>0?'Pagar resto':'Marcar pagado'}</button>`}</div>`;});
    h+=`</div></section>`;}
  // ingresos extra
  if(T.extras.length){h+=`<section class="block"><h2>Ingresos extra del mes</h2><div class="card">`;

  if(cfg.metas.length){h+=`<section class="block"><h2>Mis metas de ahorro</h2><div class="list">`;

      (T.porTipo.antojo?`<p class="small" style="margin:10px 0 0">Los antojos son el <b>${Math.round(T.porTipo.antojo/tsum*100)}%</b> de lo que marcaste este mes.</p>`:'')+`</div></section>`;}
  // alertas
  const al=[];
  cfg.cupos.forEach(c=>{if(c.topeMes>0){const u=T.porCupo[c.id]||0;if(u>c.topeMes)al.push(['danger',`Te pasaste del tope mensual de <strong>${esc(c.nombre)}</strong> por ${fmt(u-c.topeMes)}.`]);else if(u>=c.topeMes*.8)al.push(['warn',`Llevas ${fmt(u)} de ${fmt(c.topeMes)} en <strong>${esc(c.nombre)}</strong> este mes.`]);}});
  if(T.tarjeta>0) al.push(['warn',`Este mes ya sumaste <strong>${fmt(T.tarjeta)}</strong> en compras con tarjeta o crédito. Eso es deuda nueva.`]);
  CATS.forEach(c=>{const tope=cfg.topes[c.id];const g=T.porCat[c.id]||0;if(tope>0&&g>tope)al.push(['danger',`Te pasaste del tope de <strong>${c.n.toLowerCase()}</strong> por ${fmt(g-tope)}.`]);
    else if(tope>0&&g>=tope*.8)al.push(['warn',`Vas en el ${Math.round(g/tope*100)}% del tope de <strong>${c.n.toLowerCase()}</strong>. Te quedan ${fmt(tope-g)}.`]);});
  cfg.cupos.forEach(c=>{const s=cupoState(c);if(s.cls==='danger')al.push(['danger',`<strong>${esc(c.nombre)}</strong> está al ${Math.round(s.p*100)}% del cupo. No la uses hasta bajarla.`]);});
  if(al.length) h+=al.map(a=>`<div class="alert ${a[0]}"><p>${a[1]}</p></div>`).join('');

      h+=`<div style="padding:4px 0 8px"><div class="row"><span>${c.e} ${c.n}</span><span class="small muted">${fmt(g)} de ${fmt(tope)}</span></div>${bar(p,p>1?'danger':p>=.8?'warn':'')}</div>`;});
    h+=`</div></section>`;}
  // cupos resumen
  if(cfg.cupos.length){const deuda=cfg.cupos.reduce((a,c)=>a+c.consumo,0),cupo=cfg.cupos.reduce((a,c)=>a+c.cupo,0),fr=cfg.cupos.filter(c=>c.congelado);
    h+=`<section class="block"><h2>Mis cupos</h2><div class="card"><div class="row"><span>Deuda total</span><b class="num">${fmt(deuda)}</b></div>${bar(cupo?deuda/cupo:0,deuda/cupo>=.7?'danger':deuda/cupo>=.3?'warn':'')}
      <div class="small muted">${fmt(cupo-deuda)} disponibles de ${fmt(cupo)}${fr.length?` · ❄ ${fr.length} congelado${fr.length>1?'s':''}`:''}</div></div></section>`;}
  // por categoria
  const cats=Object.entries(T.porCat).sort((a,b)=>b[1]-a[1]);
  h+=`<section class="block"><h2>En qué se fue la plata</h2><div class="card">`;
  if(!cats.length) h+=`<div class="empty">Todavía no hay gastos este mes. Toca <b>+ Registrar</b> para anotar el primero.</div>`;
  else cats.forEach(([id,v])=>{const c=catById(id);h+=`<div class="cat-line"><span class="em">${c.e}</span><span class="grow">${c.n}</span><span class="amt">${fmt(v)}</span></div>`;});
  h+=`</div></section>`;
  if(S.mode==='local') h+=`<p class="note">Tus datos se guardan solo en este celular. Descarga un respaldo cada semana desde la pestaña Plan.</p>`;
  main.innerHTML=h;
  main.querySelectorAll('[data-fpay]').forEach(b=>b.onclick=()=>{const f=cfg.fijos.find(f=>f.id===b.dataset.fpay);if(!f)return;
    const rest=Math.max(0,f.monto-pagF(f));

    else{draft={t:'gasto',cat:f.cat,medio:'efectivo',fijoId:f.id,nota:f.nombre,monto:rest,fecha:defFecha()};sheetMov('gasto');}});
  const fi=document.getElementById('firstImp'); if(fi){fi.onclick=()=>document.getElementById('firstFile').click();document.getElementById('firstFile').onchange=e=>{const f=e.target.files[0];if(f)importBackup(f);};}

function toggleFreeze(i){
  const c=S.cfg.cupos[i];
  if(c.congelado&&faltaMeta(c)>0){confirmSheet('¿Descongelar '+c.nombre+'?',[`Todavía te faltan ${fmt(faltaMeta(c))} para llegar a tu meta del ${Math.round(metaOf(c)*100)}%.`],'Descongelar igual',()=>{c.congelado=false;persist('config',S.cfg);render();});return}
  c.congelado=!c.congelado;persist('config',S.cfg);render();toast(c.congelado?c.nombre+' quedó congelada.':c.nombre+' quedó activa.');
}

function recordSerie(c){const d=today();c.serie=(c.serie||[]).slice(-399);const last=c.serie[c.serie.length-1];
  if(last&&last.f===d&&!last.l)last.v=c.consumo;else c.serie.push({f:d,v:c.consumo});}
const dLabel=p=>p.l||(+p.f.slice(8))+' '+MES3[+p.f.slice(5,7)-1].toLowerCase();
function progTxt(c){const s=c.serie||[];if(s.length<2)return 'Desde hoy se guarda cada cambio';const d=s[0].v-c.consumo;
  return d>0?`Has bajado ${fmt(d)} desde ${dLabel(s[0]).replace('Antes ','')}`:d<0?`Subió ${fmt(-d)} desde ${dLabel(s[0]).replace('Antes ','')}`:'Sin cambios todavía';}
function cupoCharts(){
  if(typeof Chart==='undefined')return; const col=themeColors(); const R=simPlan();

const MES3=['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'];
const mkLabel=k=>{const [y,m]=k.slice(2).split('-');return MES3[+m-1]+' '+y.slice(2)};
const addMonths=(k,d)=>{const [y,m]=k.slice(2).split('-').map(Number);const dt=new Date(y,m-1+d,1);return 'm-'+dt.getFullYear()+'-'+String(dt.getMonth()+1).padStart(2,'0')};
function planCfg(){const P=S.cfg.plan||{};return {cuotas:P.cuotas||{},tasas:P.tasas||{},abono:P.abono||0,desde:P.desde||addMonths(keyOf(today()),1)}}
function simPlan(){
  const P=planCfg(), start=addMonths(keyOf(today()),1), N=24;
  const debts=S.cfg.cupos.filter(c=>!c.pagoTotal&&c.consumo>0).map(c=>({id:c.id,n:c.nombre,s:c.consumo,cupo:c.cupo,q:P.cuotas[c.id]||0,r:(P.tasas[c.id]||0)/100,meta:metaOf(c),rows:[],m30:null,m0:null}));
  const base=debts.reduce((a,d)=>a+d.q,0); const months=[], total=[];
  for(let i=0;i<N;i++){const k=addMonths(start,i);months.push(k);
    let pool=base+(k>=P.desde?P.abono:0);
    debts.forEach(d=>{d.s+=d.s*d.r;d.pay=Math.min(d.s,d.q);pool-=d.pay;});
    debts.forEach(d=>{const add=Math.min(Math.max(0,pool),d.s-d.pay);d.pay+=add;pool-=add;});
    debts.forEach(d=>{d.s=Math.max(0,d.s-d.pay);d.rows.push(d.s);if(d.m30==null&&d.s<=d.meta*d.cupo)d.m30=k;if(d.m0==null&&d.s<=0)d.m0=k;});
    total.push(debts.reduce((a,d)=>a+d.s,0));}
  return {debts,months,total,base,P};
}
function planHTML(){
  const R=simPlan(), P=R.P, deb=S.cfg.cupos.filter(c=>!c.pagoTotal&&c.consumo>0);

  h+=`<div class="planrow"><span>Abono extra cada mes</span><input class="t num" inputmode="numeric" id="plAb" value="${P.abono?P.abono.toLocaleString('es-CO'):''}" placeholder="$0">

    <p class="small muted">El orden de pago sigue el de tus cupos: cuando una deuda termina, su cuota pasa a la siguiente. La tasa está en el extracto; con 0% el plan es optimista.</p>
    <button class="btn primary block" id="plSave">Guardar y recalcular</button></details>`;
  if(R.base){h+=`<details><summary>Ver saldos mes a mes</summary><div class="tbl"><table><tr><th>Mes</th>${R.debts.map(d=>`<th>${esc(d.n)}</th>`).join('')}<th>Total</th></tr>`;
    R.months.forEach((k,i)=>{if(i>0&&R.total[i-1]<=0)return;h+=`<tr><td>${mkLabel(k)}</td>${R.debts.map(d=>`<td>${fmt(d.rows[i])}</td>`).join('')}<td><b>${fmt(R.total[i])}</b></td></tr>`;});
    h+=`</table></div></details>`;}
  return h+`</div></section>`;
}

/* ---------- movimientos ---------- */
async function addItem(x){
  const key=keyOf(x.fecha); const m=await readMonth(key); m.items=m.items||[]; m.items.push(x);
  if(key===S.mk) S.month=m; persist(key,m);
  let cfgChanged=false;
  if(x.t==='gasto'&&x.medio!=='efectivo'){const c=S.cfg.cupos.find(c=>c.id===x.medio);if(c){c.consumo+=x.monto;recordSerie(c);cfgChanged=true}}
  if(x.t==='pago'){const c=S.cfg.cupos.find(c=>c.id===x.cupoId);if(c){c.consumo=Math.max(0,c.consumo-x.monto);recordSerie(c);cfgChanged=true}}
  if(x.t==='ahorro'){const mt=metaById(x.metaId);if(mt){mt.saldo=Math.max(0,mt.saldo+(x.dir==='retiro'?-1:1)*x.monto);cfgChanged=true}}
  if(String(x.fuente||'').startsWith('meta:')){const mt=metaById(x.fuente.slice(5));if(mt){mt.saldo=Math.max(0,mt.saldo-x.monto);cfgChanged=true}}
  if(x.t==='gasto'){S.cfg.lastMedio=x.medio;const k=r=>r.cat+'|'+(r.nota||'')+'|'+r.monto+'|'+r.medio;
    S.cfg.rec=[{cat:x.cat,medio:x.medio,monto:x.monto,nota:x.nota||'',tipo:x.tipo||''}].concat((S.cfg.rec||[]).filter(r=>k(r)!==k(x))).slice(0,8);cfgChanged=true}
  if(cfgChanged) persist('config',S.cfg);
  render();
}
function delItem(x){
  S.month.items=S.month.items.filter(i=>i.id!==x.id); persist(S.mk,S.month);
  if(x.hist){toast('Movimiento borrado.');render();return}
  if(x.t==='gasto'&&x.medio!=='efectivo'){const c=S.cfg.cupos.find(c=>c.id===x.medio);if(c){c.consumo=Math.max(0,c.consumo-x.monto);recordSerie(c);persist('config',S.cfg)}}
  if(x.t==='pago'){const c=S.cfg.cupos.find(c=>c.id===x.cupoId);if(c){c.consumo+=x.monto;recordSerie(c);persist('config',S.cfg)}}
  if(x.t==='ahorro'){const mt=metaById(x.metaId);if(mt){mt.saldo=Math.max(0,mt.saldo-(x.dir==='retiro'?-1:1)*x.monto);persist('config',S.cfg)}}
  if(String(x.fuente||'').startsWith('meta:')){const mt=metaById(x.fuente.slice(5));if(mt){mt.saldo+=x.monto;persist('config',S.cfg)}}
  toast('Movimiento borrado.'); render();
}

/* ---------- hojas ---------- */
const scrim=document.getElementById('scrim'),sheet=document.getElementById('sheet'),sb=document.getElementById('sheetBody');
let lastFocus=null;
function openSheet(html,after){lastFocus=document.activeElement;sb.innerHTML=html;scrim.classList.add('open');sheet.classList.add('open');if(after)after();
  const f=sb.querySelector('input,button');if(f)setTimeout(()=>f.focus(),60);}
function closeSheet(){scrim.classList.remove('open');sheet.classList.remove('open');if(lastFocus&&lastFocus.focus)lastFocus.focus();}
scrim.onclick=closeSheet; document.addEventListener('keydown',e=>{if(e.key==='Escape')closeSheet()});
function moneyInput(el){el.addEventListener('input',()=>{const v=parseMoney(el.value);el.value=v?v.toLocaleString('es-CO'):''});}
function confirmSheet(title,lines,okTxt,onOk,cancelTxt){
  openSheet(`<h3>${esc(title)}</h3><div class="warnlist">${lines.map(l=>`<div class="alert warn"><p>${l}</p></div>`).join('')}</div>
    <div class="actions" style="margin-top:0"><button class="btn primary" id="cNo" style="flex:1">${cancelTxt||'Cancelar'}</button><button class="btn" id="cOk" style="flex:1">${esc(okTxt)}</button></div>`,
    ()=>{document.getElementById('cNo').onclick=closeSheet;document.getElementById('cOk').onclick=()=>{closeSheet();onOk();};});
}

let draft=null;
function sheetMov(tipo){
  draft=draft&&draft.t===tipo?draft:{t:tipo,cat:'comidas',medio:S.cfg.lastMedio||'efectivo',concepto:'Sueldo',dir:'aporte',fecha:defFecha()};
  if(!draft.fuente)draft.fuente='sueldo'; if(!draft.metaId&&S.cfg.metas[0])draft.metaId=S.cfg.metas[0].id;
  const cupos=S.cfg.cupos, Tm=totals(S.month);
  const fuenteChips=()=>`<label class="f">¿Con qué plata?</label><div class="chips" id="mFue"><button class="chip" data-f="sueldo" aria-pressed="${draft.fuente==='sueldo'}">Sueldo</button>`+
    Tm.extras.map(x=>`<button class="chip" data-f="ing:${esc(x.id)}" aria-pressed="${draft.fuente==='ing:'+x.id}">${esc(x.concepto)} · quedan ${fmt(Math.max(0,x.monto-(Tm.usoFuente['ing:'+x.id]||0)))}</button>`).join('')+
    (tipo!=='ahorro'?S.cfg.metas.filter(m=>m.saldo>0).map(m=>`<button class="chip" data-f="meta:${esc(m.id)}" aria-pressed="${draft.fuente==='meta:'+m.id}">De mi meta: ${esc(m.nombre)} (${fmt(m.saldo)})</button>`).join(''):'')+`</div>`;
  let h=`<div class="seg" role="group" aria-label="Tipo de movimiento"><button data-t="gasto" aria-pressed="${tipo==='gasto'}">Gasto</button><button data-t="ingreso" aria-pressed="${tipo==='ingreso'}">Ingreso</button><button data-t="pago" aria-pressed="${tipo==='pago'}">Pago deuda</button><button data-t="ahorro" aria-pressed="${tipo==='ahorro'}">Ahorro</button></div>
    <label class="f" for="mMonto">Monto</label><input class="t money" id="mMonto" inputmode="numeric" placeholder="$0" autocomplete="off" value="${draft.monto?draft.monto.toLocaleString('es-CO'):''}">`;
  if(tipo==='gasto'){
    h+=`<label class="f">Categoría</label><div class="chips" id="mCats">${CATS.map(c=>`<button class="chip" data-c="${c.id}" aria-pressed="${draft.cat===c.id}">${c.e} ${c.n}</button>`).join('')}</div>
      <label class="f">¿Con qué pagaste?</label><div class="chips" id="mMed"><button class="chip" data-m="efectivo" aria-pressed="${draft.medio==='efectivo'}">Efectivo o débito</button>
      ${cupos.map(c=>`<button class="chip ${c.congelado?'frozen':''}" data-m="${esc(c.id)}" aria-pressed="${draft.medio===c.id}">${c.congelado?'❄ ':''}${esc(c.nombre)}</button>`).join('')}</div>
      <label class="f">Tipo de gasto</label><div class="chips" id="mTipo">${TIPOS.map(t=>`<button class="chip" data-tp="${t.id}" aria-pressed="${draft.tipo===t.id}">${t.n}</button>`).join('')}</div>
      ${fuenteChips()}
      <label class="f" for="mNota">Nota (opcional)</label><input class="t" id="mNota" placeholder="Ej.: almuerzo con el equipo" value="${esc(draft.nota||'')}">`;
  } else if(tipo==='ahorro'){
    if(!S.cfg.metas.length) h+=`<div class="alert warn"><p>Primero crea una meta en la pestaña Plan.</p></div>`;
    else h+=`<label class="f">Meta</label><div class="chips" id="mMeta">${S.cfg.metas.map(m=>`<button class="chip" data-mt="${esc(m.id)}" aria-pressed="${draft.metaId===m.id}">${esc(m.nombre)} · ${fmt(m.saldo)}</button>`).join('')}</div>
      <label class="f">Movimiento</label><div class="chips" id="mDir"><button class="chip" data-d="aporte" aria-pressed="${draft.dir!=='retiro'}">Ahorrar</button><button class="chip" data-d="retiro" aria-pressed="${draft.dir==='retiro'}">Sacar</button></div>
      ${draft.dir!=='retiro'?fuenteChips():''}`;
  } else if(tipo==='ingreso'){
    h+=`<label class="f">Concepto</label><div class="chips" id="mIng">${INGRESOS.map(c=>`<button class="chip" data-i="${c}" aria-pressed="${draft.concepto===c}">${c}</button>`).join('')}</div>`;
  } else {
    if(!cupos.length) h+=`<div class="alert warn"><p>Primero agrega tus tarjetas en la pestaña Cupos.</p></div>`;
    else h+=`<label class="f">¿A qué deuda le pagaste?</label><div class="chips" id="mPag">${cupos.map(c=>`<button class="chip" data-p="${esc(c.id)}" aria-pressed="${draft.cupoId===c.id}">${esc(c.nombre)} · debes ${fmt(c.consumo)}</button>`).join('')}</div>${fuenteChips()}`;
  }
  h+=`<label class="f" for="mFecha">Fecha</label><input class="t" type="date" id="mFecha" value="${draft.fecha}">
    <div style="margin-top:18px"><button class="btn primary block" id="mSave">${({gasto:'Guardar gasto',ingreso:'Guardar ingreso',pago:'Guardar pago',ahorro:'Guardar ahorro'})[tipo]}</button></div>
    <div id="mErr" class="small" style="color:var(--danger);margin-top:8px" role="alert"></div>`;
  openSheet(h,()=>{
    moneyInput(document.getElementById('mMonto'));
    sb.querySelectorAll('.seg button').forEach(b=>b.onclick=()=>sheetMov(b.dataset.t));
    const pick=(sel,attr,prop)=>sb.querySelectorAll(sel+' .chip').forEach(b=>b.onclick=()=>{draft[prop]=b.dataset[attr];sb.querySelectorAll(sel+' .chip').forEach(o=>o.setAttribute('aria-pressed',o===b));});
    pick('#mCats','c','cat');pick('#mMed','m','medio');pick('#mIng','i','concepto');pick('#mPag','p','cupoId');pick('#mTipo','tp','tipo');pick('#mFue','f','fuente');pick('#mMeta','mt','metaId');
    sb.querySelectorAll('#mDir .chip').forEach(b=>b.onclick=()=>{draft.dir=b.dataset.d;draft.monto=parseMoney(document.getElementById('mMonto').value);sheetMov('ahorro');});
    document.getElementById('mSave').onclick=()=>saveMov(tipo);
  });
}
function saveMov(tipo){
  const monto=parseMoney(document.getElementById('mMonto').value), fecha=document.getElementById('mFecha').value||today(), err=document.getElementById('mErr');
  if(!monto){err.textContent='Escribe el monto.';return}
  draft.fecha=fecha;
  const x={id:uid8(),ts:Date.now(),t:tipo,monto,fecha};
  if(tipo==='ingreso'){x.concepto=draft.concepto;closeSheet();draft=null;addItem(x).then(()=>toast('Ingreso guardado.'));return}
  const fuente=draft.fuente&&draft.fuente!=='sueldo'?draft.fuente:null;
  if(fuente&&fuente.startsWith('meta:')){const mt=metaById(fuente.slice(5));if(!mt||monto>mt.saldo){err.textContent='En esa meta solo tienes '+fmt(mt?mt.saldo:0)+'.';return}}
  if(tipo==='ahorro'){const mt=metaById(draft.metaId);if(!mt){err.textContent='Primero crea una meta en la pestaña Plan.';return}
    x.metaId=mt.id;x.dir=draft.dir==='retiro'?'retiro':'aporte';if(x.dir==='aporte'&&fuente&&fuente.startsWith('ing:'))x.fuente=fuente;
    if(x.dir==='retiro'&&monto>mt.saldo){err.textContent='Solo tienes '+fmt(mt.saldo)+' en esa meta.';return}
    closeSheet();draft=null;addItem(x).then(()=>{toast(mt.saldo>=mt.meta?'Guardado. ¡Meta cumplida!':`Guardado. ${mt.nombre}: faltan ${fmt(mt.meta-mt.saldo)}.`)});return}
  if(fuente)x.fuente=fuente;
  if(tipo==='pago'){if(!draft.cupoId){err.textContent='Elige a qué deuda le pagaste.';return}x.cupoId=draft.cupoId;if(draft.fijoId)x.fijoId=draft.fijoId;closeSheet();draft=null;
    addItem(x).then(()=>{const c=S.cfg.cupos.find(c=>c.id===x.cupoId);toast(c?`Pago guardado. ${c.nombre}: debes ${fmt(c.consumo)}.`:'Pago guardado.')});return}
  if(draft.fijoId)x.fijoId=draft.fijoId;
  x.cat=draft.cat;x.medio=draft.medio;x.nota=(document.getElementById('mNota').value||'').trim().slice(0,80);if(draft.tipo)x.tipo=draft.tipo;
  if(fuente&&fuente.startsWith('meta:')&&x.medio!=='efectivo'){err.textContent='Para pagar con una meta, elige «Efectivo o débito».';return}
  checkAndSave(x);
}
function checkAndSave(x){
  const monto=x.monto,fecha=x.fecha;
  // revisiones antes de guardar
  const w=[]; const cu=S.cfg.cupos.find(c=>c.id===x.medio);
  if(cu){
    if(cu.congelado) w.push(`❄ <strong>${esc(cu.nombre)}</strong> está congelada. Te faltan ${fmt(faltaMeta(cu))} de pago para llegar a tu meta.`);
    const p=(cu.consumo+monto)/cu.cupo;
    if(cu.consumo+monto>cu.cupo) w.push(`Esta compra supera el cupo de ${esc(cu.nombre)}: solo tienes ${fmt(cu.cupo-cu.consumo)} disponibles.`);
    else if(p>=.7) w.push(`Con esta compra ${esc(cu.nombre)} quedaría al ${Math.round(p*100)}% del cupo, en zona crítica.`);
    else if(!cu.congelado) w.push(`Esta compra suma ${fmt(monto)} a tu deuda en ${esc(cu.nombre)}.`);
    if(cu.topeMes>0&&keyOf(fecha)===S.mk){const u=totals(S.month).porCupo[cu.id]||0;if(u+monto>cu.topeMes)w.push(`Con esta compra pasas tu tope mensual de ${esc(cu.nombre)} (${fmt(cu.topeMes)}) por ${fmt(u+monto-cu.topeMes)}.`);}
  }
  const tope=S.cfg.topes[x.cat];
  const doSave=async()=>{closeSheet();draft=null;await addItem(x);
    const m=await readMonth(keyOf(x.fecha));const g=m.items.filter(i=>i.t==='gasto'&&i.cat===x.cat).reduce((a,i)=>a+i.monto,0);
    toast(tope>0?`Gasto guardado. Te quedan ${fmt(Math.max(0,tope-g))} del tope de ${catById(x.cat).n.toLowerCase()}.`:'Gasto guardado.');};
  const finish=()=>{
    if(tope>0){readMonth(keyOf(fecha)).then(m=>{const g=(m.items||[]).filter(i=>i.t==='gasto'&&i.cat===x.cat).reduce((a,i)=>a+i.monto,0);
      if(g+monto>tope) w.push(`Con este gasto te pasas del tope de ${catById(x.cat).n.toLowerCase()} (${fmt(tope)}) por ${fmt(g+monto-tope)}.`);
      if(w.length) confirmSheet('Antes de guardar',w,'Registrar de todas formas',doSave,'Mejor no'); else doSave();});}
    else if(w.length) confirmSheet('Antes de guardar',w,'Registrar de todas formas',doSave,'Mejor no');
    else doSave();
  };
  finish();
}
function sheetPago(i){draft={t:'pago',cupoId:S.cfg.cupos[i].id,fecha:defFecha()};sheetMov('pago');}
function sheetFijo(i){
  const f=i>=0?S.cfg.fijos[i]:{nombre:'',monto:0,cat:'vivienda'};
  openSheet(`<h3>${i>=0?'Editar pago fijo':'Nuevo pago fijo'}</h3>
    <label class="f" for="fN">Nombre</label><input class="t" id="fN" value="${esc(f.nombre)}" placeholder="Ej.: Arriendo">
    <label class="f" for="fM">Valor mensual</label><input class="t num" id="fM" inputmode="numeric" value="${f.monto?f.monto.toLocaleString('es-CO'):''}">
    <label class="f" for="fD">¿Es la cuota de una deuda?</label><select class="t" id="fD"><option value="">No, es un gasto</option>${S.cfg.cupos.map(c=>`<option value="${esc(c.id)}" ${c.id===f.cupoId?'selected':''}>Cuota de ${esc(c.nombre)}</option>`).join('')}</select>
    <label class="f" for="fC">Categoría (si es gasto)</label><select class="t" id="fC">${CATS.map(c=>`<option value="${c.id}" ${c.id===f.cat?'selected':''}>${c.n}</option>`).join('')}</select>
    <div class="actions"><button class="btn primary" id="fSave" style="flex:1">Guardar</button>${i>=0?'<button class="btn" id="fDel">Quitar</button>':''}</div>
    <div id="fErr" class="small" style="color:var(--danger);margin-top:8px" role="alert"></div>`,()=>{
    moneyInput(document.getElementById('fM'));
    document.getElementById('fSave').onclick=()=>{const n=document.getElementById('fN').value.trim(),m=parseMoney(document.getElementById('fM').value);
      if(!n||!m){document.getElementById('fErr').textContent='Escribe el nombre y el valor.';return}
      const nf={...f,nombre:n.slice(0,40),monto:m,cat:document.getElementById('fC').value};const dv=document.getElementById('fD').value;if(dv)nf.cupoId=dv;else delete nf.cupoId;
      if(i>=0)S.cfg.fijos[i]=nf; else {nf.id='f'+uid8();S.cfg.fijos.push(nf);}
      persist('config',S.cfg);closeSheet();render();toast('Pago fijo guardado.');};
    const d=document.getElementById('fDel'); if(d) d.onclick=()=>{S.cfg.fijos.splice(i,1);persist('config',S.cfg);closeSheet();render();};
  });
}
function sheetMeta(i){
  const fo=i>=0?S.cfg.metas[i]:{nombre:'',meta:0,saldo:0};
  openSheet(`<h3>${i>=0?'Editar meta':'Nueva meta'}</h3>
    <label class="f" for="foN">Nombre</label><input class="t" id="foN" value="${esc(fo.nombre)}">
    <label class="f" for="foM">Meta</label><input class="t num" id="foM" inputmode="numeric" value="${fo.meta?fo.meta.toLocaleString('es-CO'):''}">
    <label class="f" for="foS">Lo que tienes hoy</label><input class="t num" id="foS" inputmode="numeric" value="${fo.saldo?fo.saldo.toLocaleString('es-CO'):''}" placeholder="$0">
    <div class="actions"><button class="btn primary" id="foSave" style="flex:1">Guardar</button>${i>=0?'<button class="btn" id="foDel">Quitar</button>':''}</div>`,()=>{
    ['foM','foS'].forEach(id=>moneyInput(document.getElementById(id)));
    document.getElementById('foSave').onclick=()=>{const nm={...fo,nombre:document.getElementById('foN').value.trim().slice(0,50)||'Mi meta',
      meta:parseMoney(document.getElementById('foM').value),saldo:parseMoney(document.getElementById('foS').value)};
      if(i>=0)S.cfg.metas[i]=nm;else{nm.id='m'+uid8();S.cfg.metas.push(nm);}persist('config',S.cfg);closeSheet();render();toast('Meta guardada.');};
    const d=document.getElementById('foDel');if(d)d.onclick=()=>{closeSheet();confirmSheet('¿Quitar '+fo.nombre+'?',['Los movimientos ya registrados se conservan.'],'Quitar',()=>{S.cfg.metas.splice(i,1);persist('config',S.cfg);render();});};
  });
}
function sheetCupo(i){
  const c=i>=0?S.cfg.cupos[i]:{nombre:'',uso:'',cupo:0,consumo:0,meta:.3,congelado:false};
  openSheet(`<h3>${i>=0?'Editar '+esc(c.nombre):'Nueva tarjeta o crédito'}</h3>
    <label class="f" for="cN">Nombre</label><input class="t" id="cN" value="${esc(c.nombre)}" placeholder="Ej.: ADDI">
    <label class="f" for="cU">Para qué la usas (opcional)</label><input class="t" id="cU" value="${esc(c.uso||'')}" placeholder="Ej.: comidas fuera">
    <label class="f" for="cC">Cupo total</label><input class="t num" id="cC" inputmode="numeric" value="${c.cupo?c.cupo.toLocaleString('es-CO'):''}">
    <label class="f" for="cD">Lo que debes hoy</label><input class="t num" id="cD" inputmode="numeric" value="${c.consumo?c.consumo.toLocaleString('es-CO'):''}">
    <label class="f" for="cT">Tope de compras al mes (opcional)</label><input class="t num" id="cT" inputmode="numeric" value="${c.topeMes?c.topeMes.toLocaleString('es-CO'):''}" placeholder="Sin tope">
    <label class="f" for="cM">Meta para descongelar (% del cupo)</label><input class="t num" id="cM" inputmode="numeric" value="${Math.round(metaOf(c)*100)}">
    <div class="actions"><button class="btn primary" id="cSave" style="flex:1">Guardar</button>${i>=0?'<button class="btn" id="cDel">Quitar</button>':''}</div>
    <div id="cErr" class="small" style="color:var(--danger);margin-top:8px" role="alert"></div>`,()=>{
    ['cC','cD','cT'].forEach(id=>moneyInput(document.getElementById(id)));
    document.getElementById('cSave').onclick=()=>{const n=document.getElementById('cN').value.trim(),cupo=parseMoney(document.getElementById('cC').value);
      if(!n||!cupo){document.getElementById('cErr').textContent='Escribe el nombre y el cupo total.';return}
      const nc={...c,nombre:n.slice(0,40),uso:document.getElementById('cU').value.trim().slice(0,40),cupo,consumo:parseMoney(document.getElementById('cD').value),
        meta:Math.min(100,Math.max(0,parseMoney(document.getElementById('cM').value)))/100,topeMes:parseMoney(document.getElementById('cT').value)};
      if(i>=0)S.cfg.cupos[i]=nc; else {nc.id='c'+uid8();S.cfg.cupos.push(nc);}
      if(nc.consumo!==c.consumo||i<0)recordSerie(nc);
      persist('config',S.cfg);closeSheet();render();toast('Cupo guardado.');};
    const d=document.getElementById('cDel'); if(d) d.onclick=()=>{closeSheet();confirmSheet('¿Quitar '+c.nombre+'?',['Los movimientos ya registrados se conservan.'],'Quitar',()=>{S.cfg.cupos.splice(i,1);persist('config',S.cfg);render();});};
  });
}

/* ---------- navegación ---------- */
let tt=null;
function toast(t){const el=document.getElementById('toast');el.textContent=t;el.style.display='block';clearTimeout(tt);tt=setTimeout(()=>el.style.display='none',3200);}
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{S.view=b.dataset.v;render();window.scrollTo(0,0);});
document.getElementById('fab').onclick=()=>{if(!S.cfg)return;draft=null;sheetMov('gasto');};
function shiftMonth(d){const [y,m]=S.mk.slice(2).split('-').map(Number);const dt=new Date(y,m-1+d,1);S.mk='m-'+dt.getFullYear()+'-'+String(dt.getMonth()+1).padStart(2,'0');watchMonth();}
document.getElementById('prevM').onclick=()=>shiftMonth(-1);
document.getElementById('nextM').onclick=()=>shiftMonth(1);
const hv=(location.hash||'').slice(1); if(['inicio','cupos','topes','historial','graficas'].includes(hv)) S.view=hv;
setTitle(); init();
if('serviceWorker' in navigator&&location.protocol==='https:'){navigator.serviceWorker.register('sw.js').catch(()=>{});
  let reloaded=false;navigator.serviceWorker.addEventListener('controllerchange',()=>{if(reloaded)return;reloaded=true;location.reload();});}
})();
</script>
